<!doctype html>
<html><head><meta charset="utf-8"><title>Buddy avatars</title>
<style>
body{background:#faf8f3;font-family:Georgia,serif;margin:0;padding:40px;color:#1a1a1a}
h1{font-size:24px;margin:0 0 6px}p{color:#6b675e;margin:0 0 30px}
.grid{display:flex;flex-wrap:wrap;gap:26px}
.card{background:#fff;border:1px solid #e3e0d8;border-radius:12px;padding:22px;text-align:center;width:180px}
.card h3{font-size:14px;margin:14px 0 2px}.card span{font-size:12px;color:#8a857a}
svg{display:block;margin:0 auto}
</style></head><body>
<h1>Buddy Scout — avatar options</h1>
<p>All SVG, crisp at any size. Accent matches the app (#c8492e).</p>
<div class="grid">

  <!-- A: Compass/scout -->
  <div class="card">
  <svg width="96" height="96" viewBox="0 0 96 96">
    <circle cx="48" cy="48" r="44" fill="#1a1a1a"/>
    <circle cx="48" cy="48" r="34" fill="none" stroke="#faf8f3" stroke-width="2" opacity=".4"/>
    <polygon points="48,20 56,48 48,44 40,48" fill="#c8492e"/>
    <polygon points="48,76 40,48 48,52 56,48" fill="#faf8f3"/>
    <circle cx="48" cy="48" r="4" fill="#faf8f3"/>
  </svg>
  <h3>Scout Compass</h3><span>finds the right person</span>
  </div>

  <!-- B: Speech-mark buddy -->
  <div class="card">
  <svg width="96" height="96" viewBox="0 0 96 96">
    <rect x="6" y="6" width="84" height="84" rx="22" fill="#c8492e"/>
    <circle cx="36" cy="42" r="7" fill="#faf8f3"/>
    <circle cx="60" cy="42" r="7" fill="#faf8f3"/>
    <path d="M32 60 q16 14 32 0" stroke="#faf8f3" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>
  <h3>Buddy Face</h3><span>friendly, approachable</span>
  </div>

  <!-- C: Radar ping -->
  <div class="card">
  <svg width="96" height="96" viewBox="0 0 96 96">
    <circle cx="48" cy="48" r="44" fill="#faf8f3" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="48" cy="48" r="30" fill="none" stroke="#e3e0d8" stroke-width="2"/>
    <circle cx="48" cy="48" r="16" fill="none" stroke="#e3e0d8" stroke-width="2"/>
    <line x1="48" y1="48" x2="80" y2="26" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="66" cy="34" r="6" fill="#c8492e"/>
  </svg>
  <h3>Radar Ping</h3><span>locks onto the target</span>
  </div>

  <!-- D: Monogram B -->
  <div class="card">
  <svg width="96" height="96" viewBox="0 0 96 96">
    <rect x="6" y="6" width="84" height="84" rx="20" fill="#1a1a1a"/>
    <text x="48" y="66" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#c8492e" text-anchor="middle">B</text>
  </svg>
  <h3>Monogram</h3><span>simple, editorial</span>
  </div>

</div>
</body></html>
